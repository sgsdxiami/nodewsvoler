<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宁静的早晨</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEFA 0%, #98FB98 40%, #90EE90 60%, #8FBC8F 100%);
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        /* 天空与阳光 */
        .sun {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #FFF8 20%, #FFEB3B 100%);
            border-radius: 50%;
            box-shadow: 0 0 80px #FFEB3B, 0 0 160px #FFD700;
            animation: shine 8s infinite alternate;
        }

        @keyframes shine {
            0% { box-shadow: 0 0 80px #FFEB3B, 0 0 160px #FFD700; }
            100% { box-shadow: 0 0 100px #FFEB3B, 0 0 200px #FFFF00; }
        }

        /* 小河 */
        .river {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 35%;
            background: linear-gradient(to bottom, #4682B4 0%, #87CEFA 100%);
            overflow: hidden;
        }
        .wave {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 80px;
            background: rgba(135, 206, 250, 0.4);
            border-radius: 40%;
            animation: wave 12s linear infinite;
        }
        .wave:nth-child(2) { animation-delay: -6s; opacity: 0.6; }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* 树木 */
        .tree {
            position: absolute;
            bottom: 30%;
        }
        .trunk {
            width: 30px;
            height: 150px;
            background: #8B4513;
            position: relative;
            margin: 0 auto;
        }
        .leaves {
            width: 180px;
            height: 180px;
            background: #228B22;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -100px;
            left: -75px;
            box-shadow: 0 -20px 30px rgba(0,100,0,0.3);
        }

        .tree1 { left: 10%; }
        .tree2 { left: 25%; transform: scale(1.2); }
        .tree3 { right: 15%; }
        .tree4 { right: 30%; transform: scale(0.9); }

        /* 小鸟 */
        .bird {
            position: absolute;
            font-size: 30px;
            animation: fly 18s linear infinite;
        }
        .bird::before {
            content: "❜ ❝";
            color: #333;
            animation: flap 0.4s infinite;
        }

        .bird1 { top: 20%; left: -10%; animation-duration: 20s; }
        .bird2 { top: 25%; left: -15%; animation-duration: 24s; animation-delay: 5s; }
        .bird3 { top: 18%; left: -8%; animation-duration: 22s; animation-delay: 10s; }

        @keyframes fly {
            0%   { transform: translateX(0) translateY(0); }
            50%  { transform: translateX(100vw) translateY(-50px); }
            100% { transform: translateX(100vw) translateY(0); }
        }
        @keyframes flap {
            0%, 100% { transform: rotateY(0); }
            50% { transform: rotateY(180deg); }
        }

        /* 标题 */
        .title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9);
            font-size: 4vw;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="sun"></div>

    <div class="title">宁静的早晨</div>

    <!-- 树 -->
    <div class="tree tree1"><div class="trunk"><div class="leaves"></div></div></div>
    <div class="tree tree2"><div class="trunk"><div class="leaves"></div></div></div>
    <div class="tree tree3"><div class="trunk"><div class="leaves"></div></div></div>
    <div class="tree tree4"><div class="trunk"><div class="leaves"></div></div></div>

    <!-- 小鸟 -->
    <div class="bird bird1"></div>
    <div class="bird bird2"></div>
    <div class="bird bird3"></div>

    <!-- 小河 -->
    <div class="river">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

</body>
</html>
